name: Release

# Manual release workflow. The version must be MAJOR.MINOR.PATCH, have a
# matching section in docs/agent-access/skill-compatibility.md, and either no
# v* tag or an existing annotated tag at the same commit with no Release yet.
# The tag and GitHub Release are created from the same commit only after every
# check passes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (MAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run from main (got $GITHUB_REF)."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a leading v."
            exit 1
          fi

          if ! grep -Fqx "## v$VERSION" docs/agent-access/skill-compatibility.md; then
            echo "::error::docs/agent-access/skill-compatibility.md has no '## v$VERSION' section."
            exit 1
          fi

          # `git ls-remote` returns 0 with empty output when the tag is absent.
          # A non-zero status here means the remote could not be queried.
          TAG_REFS=$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}") || {
            echo "::error::Could not query remote tags."
            exit 1
          }

          if [ -n "$TAG_REFS" ]; then
            TAG_COMMIT=$(printf '%s\n' "$TAG_REFS" | awk -v ref="refs/tags/v$VERSION^{}" '$2 == ref { print $1 }')
            if [ -z "$TAG_COMMIT" ]; then
              echo "::error::Tag v$VERSION exists but is not an annotated tag."
              exit 1
            fi
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag v$VERSION points to $TAG_COMMIT, not $GITHUB_SHA."
              exit 1
            fi
            echo "Tag v$VERSION already exists at this commit; the release step will reuse it."
            echo "SKIP_TAG=1" >> "$GITHUB_ENV"
          else
            echo "SKIP_TAG=0" >> "$GITHUB_ENV"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

          echo "Release request for v$VERSION is valid."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check skill discovery
        run: npm run skills:check

      - name: Create annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${SKIP_TAG:-0}" = "1" ]; then
            echo "Reusing the existing annotated tag v$VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Kakeai v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Publish GitHub Release
        env:
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
