<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Kakeai Composition Starter</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1020; }
    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans JP", sans-serif;
      color: #ffffff;
    }
    .title { font-size: 140px; font-weight: 700; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="cmp.motion.starter"
    data-width="1920"
    data-height="1080"
    data-duration="5"
    data-fps="30"
  >
    <div class="stage"><div class="title">Starter</div></div>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    timeline.from(".title", { opacity: 0, y: 40, duration: 0.8, ease: "power2.out" });
    window.__timelines["cmp.motion.starter"] = timeline;
  </script>
</body>
</html>
