<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Kakeai Composition Starter</title>
  <!--
    Style Kit usage (only when the API seeded kakeai-style/ into the draft):
    1. Link the kit CSS files and list each linked file in manifest dependencies:
       <link rel="stylesheet" href="kakeai-style/tokens.css">
       <link rel="stylesheet" href="kakeai-style/fonts.css">
       <link rel="stylesheet" href="kakeai-style/components.css">
    2. Use only var(--kakeai-font-*) for fonts and the .kk-* components (e.g. .kk-paper,
       .kk-tape) instead of raw colors and family names.
    3. Wait for document.fonts.ready, then register the timeline, e.g.:
       document.fonts.ready.then(() => { window.__timelines["cmp.motion.starter"] = timeline; });
    4. Never edit or POST changes under kakeai-style/; publish rejects it with
       STYLE_KIT_MODIFIED.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #0b1020; }
    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--kakeai-font-title, sans-serif);
      color: #ffffff;
    }
    .title { font-size: 140px; font-weight: 700; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="cmp.motion.starter"
    data-width="1920"
    data-height="1080"
    data-duration="5"
    data-fps="30"
  >
    <div class="stage"><div class="title">Starter</div></div>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    timeline.from(".title", { opacity: 0, y: 40, duration: 0.8, ease: "power2.out" });
    (document.fonts?.ready ?? Promise.resolve()).then(() => {
      window.__timelines["cmp.motion.starter"] = timeline;
    });
  </script>
</body>
</html>
